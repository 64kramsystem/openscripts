name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The action only installs bats; tests must be run in a separate step.
      - uses: bats-core/bats-action@4.0.0
      - run: bats ./*.bats

  minitest:
    name: kernel_version (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: ruby kernel_packages_maintenance/kernel_version_test.rb

  set_song_bpms:
    name: set_song_bpms (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: ruby set_song_bpms_test.rb

  fill_labels:
    name: fill_labels (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec ruby fill_labels_test.rb
