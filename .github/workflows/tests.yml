name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The action only installs bats; tests must be run in a separate step.
      - uses: bats-core/bats-action@4.0.0
      - run: bats ./*.bats

  minitest:
    name: kernel_version (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: ruby kernel_packages_maintenance/kernel_version_test.rb

  set_song_bpms:
    name: set_song_bpms (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - run: ruby set_song_bpms_test.rb

  fill_labels:
    name: fill_labels (minitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec ruby fill_labels_test.rb

  create_jp2_pdf:
    name: create_jp2_pdf (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install imagecodecs numpy pillow pypdf
      - run: python tests/create_jp2_pdf_test.py

  scrape_terminal_screen_atspi:
    name: scrape_terminal_screen_atspi (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update
      - run: sudo apt-get install --yes gir1.2-atspi-2.0 python3-gi
      - run: /usr/bin/python3 scrape_terminal_screen_atspi_test.py
